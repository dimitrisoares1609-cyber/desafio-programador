# Publica o portal institucional (pasta portal-institucional/) no GitHub Pages.
# Requer: Settings > Pages > Source: GitHub Actions.
name: Publicar portal no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portal-institucional/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; a mais recente vence.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Enviar a pasta do portal
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal-institucional
      - id: deploy
        uses: actions/deploy-pages@v4
