name: Barbera

on:
  push:
    branches: [main]
    paths: ['barbera/**', '.github/workflows/barbera.yml']
  pull_request:
    paths: ['barbera/**', '.github/workflows/barbera.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barbera/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: barbera/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: barbera/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f barbera/docker-compose.yml up -d --build
      - name: Esperar a API responder pelo nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/; then exit 0; fi
            sleep 2
          done
          docker compose -f barbera/docker-compose.yml logs
          exit 1
      - run: docker compose -f barbera/docker-compose.yml down
