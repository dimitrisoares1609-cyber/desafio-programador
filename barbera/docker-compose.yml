services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - "8080:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: barbera
      JWT_SECRET: ${JWT_SECRET:-barbera-dev-secret-troque-em-producao-com-48-caracteres}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@barbera.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Barbera123!}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - mongo

volumes:
  mongo-data:
