services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /dados
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-20}"
      RETENCAO_HORAS: "${RETENCAO_HORAS:-24}"
      CONCORRENCIA: "${CONCORRENCIA:-2}"
      MAX_PAGINAS: "${MAX_PAGINAS:-60}"
    volumes:
      # Volume nomeado, não bind mount: os PDFs contêm PII e não devem
      # aparecer na árvore do repositório por acidente.
      - dados:/dados
    restart: unless-stopped

volumes:
  dados:
